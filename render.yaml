databases:
  - name: nutrition-tracker-db
    plan: free # Time-limited — see README's "Deploying the backend" section before relying on this for production.
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: nutrition-tracker-api
    runtime: node
    plan: free # Spins down on idle (cold start on the next request) — bump to "starter" once this is live for real users.
    region: oregon
    branch: claude/nutrition-app-production-rebuild-uxnk3s
    healthCheckPath: /health
    buildCommand: npm install && npm run build:shared && npm run db:generate --workspace apps/backend && npm run build --workspace apps/backend
    startCommand: npm run db:deploy --workspace apps/backend && npm run start --workspace apps/backend
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nutrition-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: USDA_FDC_API_KEY
        sync: false
